name: omnisonic
description: "Cross-platform music streaming client with unified collection experience across multiple Subsonic-compatible servers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  
  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.5.0
  
  # State Management
  flutter_bloc: ^8.1.6
  provider: ^6.1.2
  rxdart: ^0.28.0
  
  # Navigation
  go_router: ^14.6.2
  
  # HTTP & API
  dio: ^5.7.0
  json_annotation: ^4.9.0
  
  # Database
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # Audio Playback
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audioplayers: ^6.1.0
  dbus: ^0.7.10  # For Linux MPRIS integration
  
  # Secure Storage
  flutter_secure_storage: ^10.0.0
  
  # Preferences
  shared_preferences: ^2.3.3
  
  # Network & Connectivity
  connectivity_plus: ^6.1.0
  
  # Utilities
  equatable: ^2.0.7
  dartz: ^0.10.1
  crypto: ^3.0.6
  
  # Image Caching
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0
  
  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  
  # Launcher Icons
  flutter_launcher_icons: ^0.13.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets for the design system
  # assets:
  #   - assets/icons/
  #   - assets/images/

  # Custom fonts for the design system (commented out until font files are added)
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "logo.png"
  windows:
    generate: true
    image_path: "logo.png"
  macos:
    generate: true
    image_path: "logo.png"
  linux:
    generate: true
    image_path: "logo.png"
