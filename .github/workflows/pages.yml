name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/fonts/**'
      - 'logo.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fonts and logo live with the app; copy them next to the page.
      - name: Assemble site
        run: |
          mkdir -p site/fonts
          cp assets/fonts/*.ttf site/fonts/
          cp logo.png site/logo.png

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
